name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear icono
        run: |
          pip install pillow
          mkdir -p assets
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          N = 1024
          BG = (13, 27, 31, 255)
          def ring(img, scale):
              d = ImageDraw.Draw(img)
              c = N // 2
              r = int(N * 0.32 * scale)
              d.ellipse([c - r, c - r, c + r, c + r], outline=(42, 66, 73, 255), width=int(N * 0.03 * scale))
              d.arc([c - r, c - r, c + r, c + r], start=-70, end=10, fill=(255, 180, 84, 255), width=int(N * 0.075 * scale))
              dr = int(N * 0.06 * scale)
              d.ellipse([c - dr, c - r - dr, c + dr, c - r + dr], fill=(244, 251, 248, 255))
          full = Image.new("RGBA", (N, N), BG); ring(full, 1.25); full.save("assets/icon-only.png")
          fg = Image.new("RGBA", (N, N), (0, 0, 0, 0)); ring(fg, 1.0); fg.save("assets/icon-foreground.png")
          Image.new("RGBA", (N, N), BG).save("assets/icon-background.png")
          PY

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Aplicar icono y pantalla vertical
        run: |
          npx @capacitor/assets generate --android
          sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: orbita-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
