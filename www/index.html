<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Órbita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>[hidden]{display:none!important}
/* Layout: pantalla completa de un solo toque; anillo centrado, puntaje al medio, tienda como panel encima. */
:root {
  --bg: #0d1b1f;
  --panel: #14272c;
  --line: #24393f;
  --ring: #2a4249;
  --ink: #e8f1ee;
  --muted: #8aa5a6;
  --target: #ffb454;
  --on-target: #1b1306;
  --dot: #f4fbf8;
  --miss: #ff6b5e;
  --shield: #6fd3c4;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: relative; height: 100%; width: 100%; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  pointer-events: none; text-align: center; gap: 6px;
}
#score {
  font-family: var(--display); font-weight: 800;
  font-size: clamp(56px, 20vw, 120px); line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
#label { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
#title { font-family: var(--display); font-weight: 600; font-size: clamp(22px, 7vw, 34px); letter-spacing: 0.04em; }
#foot {
  position: absolute; left: 0; right: 0;
  bottom: max(28px, env(safe-area-inset-bottom, 0px));
  text-align: center; pointer-events: none;
  display: flex; flex-direction: column; gap: 6px; align-items: center;
}
#hint { font-size: 16px; font-weight: 500; }
#best { font-size: 13px; color: var(--muted); letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
.blink { animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .blink { animation: none; } }

.coin {
  display: inline-block; width: 12px; height: 12px; border-radius: 50%;
  background: var(--target); box-shadow: inset 0 0 0 2px rgba(0,0,0,0.18);
  vertical-align: -1px;
}
#wallet {
  position: absolute; top: 14px; left: 0;
  display: flex; align-items: center; gap: 8px;
  font-family: var(--display); font-weight: 600; font-size: 16px;
  font-variant-numeric: tabular-nums; pointer-events: none;
}
#shopBtn {
  position: absolute; top: 8px; right: 0;
  min-height: 44px; padding: 0 16px;
  background: var(--target); color: var(--on-target);
  border: 0; border-radius: 22px;
  font-family: var(--body); font-weight: 700; font-size: 15px;
  cursor: pointer;
}
#shopBtn:focus-visible, .buy:focus-visible, #closeShop:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

#shop {
  position: absolute; inset: 0; z-index: 5;
  background: var(--bg);
  display: flex; flex-direction: column;
  padding-top: 8px;
}
#shopHead {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-bottom: 12px;
}
#shopHead h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: 0.02em; }
#shopCoins { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; }
#closeShop {
  min-height: 44px; padding: 0 16px; background: transparent; color: var(--ink);
  border: 1px solid var(--line); border-radius: 22px; font-family: var(--body); font-weight: 500; font-size: 15px; cursor: pointer;
}
#items {
  flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y;
  display: flex; flex-direction: column; gap: 10px;
  padding-bottom: max(20px, env(safe-area-inset-bottom, 0px));
}
.item {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px; display: flex; flex-direction: column; gap: 8px;
}
.item .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.item .nm { font-weight: 700; font-size: 17px; }
.item .lv { font-size: 12px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.item .ds { font-size: 14px; color: var(--muted); line-height: 1.4; }
.item .ef { font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 6px; }
.pip { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.pip.on { background: var(--target); }
.buy {
  min-height: 44px; border: 0; border-radius: 10px; cursor: pointer;
  background: var(--target); color: var(--on-target);
  font-family: var(--body); font-weight: 700; font-size: 15px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.buy:disabled { background: var(--line); color: var(--muted); cursor: default; }
#toast {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: max(24px, env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 20px; font-weight: 700; font-size: 14px;
  z-index: 6; pointer-events: none;
}
</style>

</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="Juego Órbita: tocá cuando el punto pase por la zona ámbar"></canvas>
  <div id="hud">
    <div id="title">ÓRBITA</div>
    <div id="score" hidden>0</div>
    <div id="label">Un toque. Un error y se acabó.</div>
  </div>
  <div id="wallet"><span class="coin"></span><span id="coins">0</span></div>
  <button id="shopBtn" data-ui type="button">Tienda</button>
  <div id="foot">
    <div id="hint" class="blink">Tocá para empezar</div>
    <div id="best">Récord 0</div>
  </div>

  <div id="shop" data-ui hidden>
    <div id="shopHead">
      <h2>Tienda</h2>
      <div id="shopCoins"><span class="coin"></span><span id="shopCoinsN">0</span></div>
      <button id="closeShop" type="button">Volver</button>
    </div>
    <div id="items"></div>
  </div>
  <div id="toast" hidden></div>
</div>

<script>
(function () {
  var cv = document.getElementById("c");
  var ctx = cv.getContext("2d");
  var $ = function (id) { return document.getElementById(id); };
  var elScore = $("score"), elTitle = $("title"), elLabel = $("label"), elHint = $("hint"), elBest = $("best");
  var elCoins = $("coins"), elShop = $("shop"), elItems = $("items"), elShopCoins = $("shopCoinsN");
  var elShopBtn = $("shopBtn"), elToast = $("toast"), elHud = $("hud");

  var css = getComputedStyle(document.documentElement);
  function tok(n) { return css.getPropertyValue(n).trim(); }
  var C = { ring: tok("--ring"), target: tok("--target"), dot: tok("--dot"), miss: tok("--miss"), shield: tok("--shield") };

  var TAU = Math.PI * 2;
  var W = 0, H = 0, DPR = 1, R = 100, CX = 0, CY = 0;

  function resize() {
    var r = cv.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    R = Math.min(W * 0.36, H * 0.3);
    CX = W / 2; CY = H * 0.46;
    elHud.style.paddingTop = Math.max(0, CY - 60) + "px";
  }
  window.addEventListener("resize", resize);
  resize();

  /* ---------- Guardado ---------- */
  var best = 0;
  var save = { coins: 0, lv: { ancha: 0, freno: 0, escudo: 0, iman: 0 } };
  try { best = parseInt(localStorage.getItem("orbita-best") || "0", 10) || 0; } catch (e) {}
  try {
    var raw = localStorage.getItem("orbita-save");
    if (raw) {
      var s = JSON.parse(raw);
      save.coins = Math.max(0, s.coins | 0);
      for (var k in save.lv) save.lv[k] = Math.max(0, (s.lv && s.lv[k]) | 0);
    }
  } catch (e) {}
  function persist() { try { localStorage.setItem("orbita-save", JSON.stringify(save)); } catch (e) {} }
  function showBest() { elBest.textContent = "Récord " + best; }
  function showCoins() { elCoins.textContent = save.coins; elShopCoins.textContent = save.coins; }
  showBest(); showCoins();

  /* ---------- Habilidades ---------- */
  var SKILLS = [
    { id: "ancha", name: "Zona ancha", max: 5, base: 15,
      desc: "La zona ámbar es más grande, así es más fácil acertar.",
      effect: function (l) { return l ? "Zona +" + (l * 8) + "%" : "Sin mejora"; } },
    { id: "freno", name: "Freno suave", max: 5, base: 20,
      desc: "El punto acelera más despacio después de cada acierto.",
      effect: function (l) { return l ? "Aceleración −" + (l * 15) + "%" : "Sin mejora"; } },
    { id: "escudo", name: "Escudo", max: 3, base: 40,
      desc: "Perdonás errores en cada partida. Cada escudo absorbe uno.",
      effect: function (l) { return l ? l + (l === 1 ? " escudo" : " escudos") + " por partida" : "Sin escudos"; } },
    { id: "iman", name: "Imán", max: 5, base: 25,
      desc: "Ganás más monedas por cada acierto.",
      effect: function (l) { return (1 + l) + (l ? " monedas" : " moneda") + " por acierto"; } }
  ];
  function price(sk) { return Math.round(sk.base * Math.pow(save.lv[sk.id] + 1, 1.7)); }

  function renderShop() {
    elItems.textContent = "";
    SKILLS.forEach(function (sk) {
      var lvl = save.lv[sk.id];
      var maxed = lvl >= sk.max;
      var p = price(sk);
      var card = document.createElement("div"); card.className = "item";

      var top = document.createElement("div"); top.className = "top";
      var nm = document.createElement("div"); nm.className = "nm"; nm.textContent = sk.name;
      var lv = document.createElement("div"); lv.className = "lv"; lv.textContent = "Nivel " + lvl + " / " + sk.max;
      top.appendChild(nm); top.appendChild(lv);

      var ds = document.createElement("div"); ds.className = "ds"; ds.textContent = sk.desc;
      var ef = document.createElement("div"); ef.className = "ef"; ef.textContent = "Ahora: " + sk.effect(lvl);

      var pips = document.createElement("div"); pips.className = "pips";
      for (var i = 0; i < sk.max; i++) {
        var pip = document.createElement("div"); pip.className = "pip" + (i < lvl ? " on" : "");
        pips.appendChild(pip);
      }

      var buy = document.createElement("button");
      buy.type = "button"; buy.className = "buy";
      if (maxed) { buy.textContent = "Nivel máximo"; buy.disabled = true; }
      else {
        var c = document.createElement("span"); c.className = "coin";
        buy.appendChild(document.createTextNode("Mejorar por "));
        buy.appendChild(c);
        buy.appendChild(document.createTextNode(String(p)));
        buy.disabled = save.coins < p;
        buy.addEventListener("click", function () {
          if (save.coins < p || save.lv[sk.id] >= sk.max) return;
          save.coins -= p; save.lv[sk.id]++;
          persist(); showCoins(); renderShop();
          beep(660, 0.1, "triangle", 0.08); beep(880, 0.14, "triangle", 0.07);
          toast(sk.name + " nivel " + save.lv[sk.id]);
        });
      }
      card.appendChild(top); card.appendChild(ds); card.appendChild(ef); card.appendChild(pips); card.appendChild(buy);
      elItems.appendChild(card);
    });
  }

  var toastT = 0;
  function toast(msg) {
    elToast.textContent = msg; elToast.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(function () { elToast.hidden = true; }, 1400);
  }

  function openShop() { renderShop(); showCoins(); elShop.hidden = false; }
  function closeShop() { elShop.hidden = true; }
  elShopBtn.addEventListener("click", openShop);
  $("closeShop").addEventListener("click", closeShop);

  /* ---------- Juego ---------- */
  var state = "ready"; // ready | play | over
  var a = -Math.PI / 2, dir = 1, speed = 2.2;
  var tCenter = 0.9, tWidth = 0.8;
  var entered = false;
  var score = 0, runCoins = 0, shields = 0;
  var overAt = 0, shake = 0;
  var rings = [], parts = [];

  function norm(x) { x = x % TAU; if (x < 0) x += TAU; return x; }
  function diff(x, y) { var d = norm(x - y); if (d > Math.PI) d -= TAU; return d; }

  function newTarget() {
    tCenter = norm(a + dir * (1.3 + Math.random() * 2.4));
    var base = Math.max(0.36, 0.82 - score * 0.012);
    tWidth = Math.min(1.6, base * (1 + 0.08 * save.lv.ancha));
    entered = false;
  }

  var ac = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.value = vol || 0.08;
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  function updateUiForState() {
    var idle = state !== "play";
    elShopBtn.hidden = !idle;
  }

  function start() {
    state = "play"; score = 0; runCoins = 0; speed = 2.2; dir = 1; a = -Math.PI / 2;
    shields = save.lv.escudo;
    rings.length = 0; parts.length = 0; shake = 0;
    newTarget();
    elTitle.hidden = true; elScore.hidden = false; elScore.textContent = "0";
    elLabel.textContent = "";
    elHint.classList.remove("blink"); elHint.textContent = "";
    showBest(); updateUiForState();
  }

  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * TAU, v = 60 + Math.random() * 180;
      parts.push({ x: x, y: y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, life: 1, col: color });
    }
  }
  function dotPos() { return { x: CX + Math.cos(a) * R, y: CY + Math.sin(a) * R }; }

  function hit() {
    score++;
    elScore.textContent = score;
    var gain = 1 + save.lv.iman;
    runCoins += gain; save.coins += gain; showCoins();
    var p = dotPos();
    burst(p.x, p.y, C.target, 14);
    rings.push({ r: R, life: 1 });
    beep(520 + Math.min(score, 30) * 18, 0.12, "triangle", 0.09);
    buzz(12);
    dir = -dir;
    speed = Math.min(5.2, speed + 0.07 * (1 - 0.15 * save.lv.freno));
    newTarget();
  }

  function miss(passed) {
    if (shields > 0) {
      shields--;
      shake = 0.5;
      var p = dotPos();
      burst(p.x, p.y, C.shield, 18);
      rings.push({ r: R, life: 1, shield: true });
      beep(300, 0.18, "square", 0.06);
      buzz(30);
      if (passed) newTarget();
      return;
    }
    lose();
  }

  function lose() {
    state = "over"; overAt = performance.now(); shake = 1;
    var p = dotPos();
    burst(p.x, p.y, C.miss, 26);
    beep(140, 0.35, "sawtooth", 0.09);
    buzz(60);
    persist();
    var isRecord = score > best;
    if (isRecord) {
      best = score;
      try { localStorage.setItem("orbita-best", String(best)); } catch (e) {}
    }
    elLabel.textContent = (isRecord && score > 0 ? "Nuevo récord" : "Puntos") + " · +" + runCoins + " monedas";
    elHint.textContent = "Tocá para reintentar";
    elHint.classList.add("blink");
    showBest(); updateUiForState();
  }

  function tap(e) {
    if (e && e.target && e.target.closest && e.target.closest("[data-ui]")) return;
    if (!elShop.hidden) return;
    if (e && e.preventDefault) e.preventDefault();
    if (state === "ready") { start(); beep(440, 0.08, "triangle", 0.07); return; }
    if (state === "over") { if (performance.now() - overAt > 450) start(); return; }
    var d = Math.abs(diff(a, tCenter));
    if (d <= tWidth / 2 + 0.08) hit(); else miss(false);
  }
  document.body.addEventListener("pointerdown", tap, { passive: false });
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "Enter") tap(e);
  });

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state === "ready") {
      a += 1.1 * dt;
      tCenter = norm(a + 2.2); tWidth = 0.8;
    } else if (state === "play") {
      a = norm(a + dir * speed * dt);
      var inside = Math.abs(diff(a, tCenter)) <= tWidth / 2 + 0.08;
      if (inside) entered = true;
      else if (entered) { entered = false; miss(true); }
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 2.2);
    draw();
    requestAnimationFrame(frame);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 14 * shake, (Math.random() - 0.5) * 14 * shake);

    for (var i = rings.length - 1; i >= 0; i--) {
      var rg = rings[i];
      rg.life -= 0.035; rg.r += 3;
      if (rg.life <= 0) { rings.splice(i, 1); continue; }
      ctx.globalAlpha = rg.life * 0.5;
      ctx.strokeStyle = rg.shield ? C.shield : C.target; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(CX, CY, rg.r, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.lineCap = "round";
    ctx.strokeStyle = C.ring; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.stroke();

    ctx.strokeStyle = C.target; ctx.lineWidth = 16;
    ctx.beginPath(); ctx.arc(CX, CY, R, tCenter - tWidth / 2, tCenter + tWidth / 2); ctx.stroke();

    var col = state === "over" ? C.miss : C.dot;
    var tdir = state === "ready" ? -1 : dir;
    for (var k = 7; k >= 1; k--) {
      var ta = a - tdir * k * 0.075;
      ctx.globalAlpha = (1 - k / 8) * 0.35;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(CX + Math.cos(ta) * R, CY + Math.sin(ta) * R, 13 - k, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(CX + Math.cos(a) * R, CY + Math.sin(a) * R, 13, 0, TAU);
    ctx.fill();

    // escudos restantes: aros turquesa debajo del anillo
    if (state === "play" && shields > 0) {
      ctx.strokeStyle = C.shield; ctx.lineWidth = 3;
      var gap = 22, x0 = CX - (shields - 1) * gap / 2;
      for (var s = 0; s < shields; s++) {
        ctx.beginPath(); ctx.arc(x0 + s * gap, CY + R + 44, 8, 0, TAU); ctx.stroke();
      }
    }

    for (var j = parts.length - 1; j >= 0; j--) {
      var p = parts[j];
      p.life -= 0.03;
      if (p.life <= 0) { parts.splice(j, 1); continue; }
      p.x += p.vx * 0.016; p.y += p.vy * 0.016;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  updateUiForState();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
